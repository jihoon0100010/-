<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>아이스마터</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--line:#2c2c2c;--text:#fff;--sub:#b0b0b0;--accent:#ff4757;--ok:#2ed573}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;padding:20px;min-height:100vh}
.screen{display:none;max-width:420px;margin:0 auto}
.screen.active{display:block}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:14px}
h2{margin:0 0 6px;font-size:1.3rem}
p{margin:0 0 14px;color:var(--sub);font-size:.9rem;line-height:1.5}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #333;border-radius:8px;background:#2a2a2a;color:var(--text);font-size:1rem}
button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer}
button.ghost{background:#2a2a2a;color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:10px 0;background:#2a2a2a;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.flash .w{font-size:2rem;font-weight:800}
.flash .m{font-size:1.1rem;line-height:1.5}
.flash .hint{color:var(--sub);font-size:.8rem;margin-top:14px}
.row{display:flex;gap:8px}
.opt{margin-bottom:8px;background:#2a2a2a}
.opt.right{background:var(--ok);color:#111}
.opt.wrong{background:#6b1f27}
.keyrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.keyrow button{width:auto;padding:6px 12px;font-size:.85rem}
.score{font-size:2.4rem;font-weight:800;margin:10px 0}
</style>
</head>
<body>

<!-- 라이선스 -->
<div id="screen-license" class="screen active">
  <div
