<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이스마터</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --sub-text: #b0b0b0;
      --accent: #ff4757;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .screen {
      display: none;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .screen.active {
      display: block;
    }
    .center-box {
      text-align: center;
    }
    h2 {
      margin-top: 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #2a2a2a;
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. 라이선스 인증 화면 -->
  <div id="screen-license" class="screen active">
    <div class="center-box">
      <h2>아이스마터 라이선스</h2>
      <p style="color: var(--sub-text); margin-bottom: 20px; font-size: 0.9rem;">발급받은 라이선스 키를 입력하세요.</p>
      
      <input type="text" id="license-input" placeholder="라이선스 키 입력">
      <button type="button" onclick="verifyLicense()">입력하고 시작하기</button>
      
      <div style="margin-top: 20px; font-size: 0.8rem; color: #888;">
        * 관리자 테스트 키: <b>admin-master-key</b><br>
        * 일반 사용자 테스트 키: <b>ismarter-2026</b>
      </div>
    </div>
  </div>

  <!-- 2. 메인 대시보드 -->
  <div id="screen-home" class="screen">
    <div style="margin-bottom: 20px;">
      <h2 style="font-size: 1.3rem; margin-bottom: 4px;">환영합니다!</h2>
      <p style="color: var(--sub-text); font-size: 0.9rem;">공부 콘텐츠를 선택하세요.</p>
    </div>
    <button onclick="location.reload()">로그아웃 (처음으로)</button>
  </div>

  <!-- 3. 관리자 화면 -->
  <div id="screen-admin" class="screen">
    <div style="margin-bottom: 20px;">
      <h2 style="font-size: 1.3rem; margin-bottom: 4px; color: #ff4757;">관리자 모드</h2>
      <p style="color: var(--sub-text); font-size: 0.9rem;">키 발급 및 관리 패널</p>
    </div>
    <button onclick="location.reload()">로그아웃 (처음으로)</button>
  </div>

  <script>
    function verifyLicense() {
      var inputElement = document.getElementById('license-input');
      if (!inputElement) {
        alert("입력창을 찾을 수 없습니다.");
        return;
      }
      
      var enteredKey = inputElement.value.trim();

      if (enteredKey === 'admin-master-key') {
        alert("관리자 권한으로 로그인되었습니다.");
        document.getElementById('screen-license').style.display = 'none';
        document.getElementById('screen-admin').style.display = 'block';
      } else if (enteredKey === 'ismarter-2026') {
        alert("아이스마터에 오신 것을 환영합니다!");
        document.getElementById('screen-license').style.display = 'none';
        document.getElementById('screen-home').style.display = 'block';
      } else if (enteredKey === "") {
        alert("라이선스 키를 입력해주세요.");
      } else {
        alert("유효하지 않은 라이선스 키입니다.");
      }
    }
  </script>

</body>
</html>
