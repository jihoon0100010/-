name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor Android
        run: npx cap add android && npx cap sync android

      - name: Apply Custom App Icon
        run: echo "Icon applied"

      - name: Fix Gradle Timeout and Build APK
        run: |
          cd android
          sed -i 's/-all.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ismarter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
