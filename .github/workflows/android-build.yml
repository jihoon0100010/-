name: Build Android APK with Icon

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Initialize Capacitor Android
      run: |
        npx cap add android

    - name: Apply Custom App Icon
      run: |
        mkdir -p android/app/src/main/res/drawable
        if [ -f icon.jpeg ]; then
          cp icon.jpeg android/app/src/main/res/drawable/ic_launcher.jpeg
        fi

    - name: Build Android Project & Generate APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ismarter-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
